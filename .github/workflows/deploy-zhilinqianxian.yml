name: Deploy ZhiLinQianXian

on:
  push:
    branches: [main]
    paths:
      - 'ZhiLinQianXian/**'
      - 'Cat/**'
      - '.github/workflows/deploy-zhilinqianxian.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Run tests
        run: cd ZhiLinQianXian && npm test

      - name: Prepare static site
        run: |
          mkdir -p site
          cp ZhiLinQianXian/Source/index.html site/
          cp -r ZhiLinQianXian/Source/js ZhiLinQianXian/Source/preview site/
          if [ -d ZhiLinQianXian/Source/audio ]; then cp -r ZhiLinQianXian/Source/audio site/; fi
          mkdir -p site/Cat
          cp Cat/Source/index.html site/Cat/
          cp -r Cat/Source/css Cat/Source/js Cat/Source/assets site/Cat/

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
