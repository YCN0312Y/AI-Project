name: Deploy KuoBianZhanZheng

on:
  push:
    branches: [main]
    paths:
      - 'KuoBianZhanZheng/web/**'
      - 'KuoBianZhanZheng/js/**'
      - 'KuoBianZhanZheng/assets/**'
      - 'KuoBianZhanZheng/tools/build-web.cjs'
      - 'KuoBianZhanZheng/tools/release-transforms.cjs'
      - '.github/workflows/deploy-kuobianzhanzheng.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build static site
        run: node KuoBianZhanZheng/tools/build-web.cjs

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: KuoBianZhanZheng/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
