<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>缅因猫抚摸模拟器 · Maine Coon</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <main class="app-shell">
    <!-- Interactive cat stage -->
    <div class="stage-wrap hide-cursor" id="stageWrap">
      <canvas id="catCanvas"></canvas>
      <canvas class="feed-overlay" id="feedCanvas" aria-hidden="true" hidden></canvas>
      <button type="button" class="orbit-btn" id="btnOrbit" aria-label="360° 查看模式" aria-pressed="false" aria-controls="orbitControls" title="360° 查看 (V)" disabled>360° 查看</button>
      <button type="button" class="light-btn" id="btnLight" aria-label="切换房间光线"></button>
      <div class="webgl-error" id="webglError"></div>
    </div>

    <div class="orbit-controls" id="orbitControls" hidden>
      <span class="orbit-hint">左右拖动画面</span>
      <input type="range" id="orbitAngle" aria-label="环绕角度" min="0" max="359" step="1" value="0" />
      <output id="orbitReadout" for="orbitAngle">0°</output>
      <button type="button" class="mini-btn" id="btnOrbitReset">回正</button>
    </div>

    <!-- Core Feline Behaviors: Roll Over, Purr, Meow, Paw Bloom -->
    <div class="action-bar" role="group" aria-label="缅因猫互动动作">
      <button type="button" class="action-pill" id="btnRoll" title="翻身露肚皮 / 端坐切换 (R)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
          <path d="M3 3v5h5"></path>
        </svg>
        <span id="labelRoll">翻身</span>
      </button>

      <button type="button" class="action-pill active" id="btnAudio" title="打呼噜与环境声开关 (M)">
        <span class="icon-slot" id="iconAudio"></span>
        <span id="labelPurr">打呼噜</span>
      </button>

      <button type="button" class="action-pill" id="btnMeow" title="缅因猫喵喵叫 (C)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path>
        </svg>
        <span>喵喵叫</span>
      </button>

      <button type="button" class="action-pill" id="btnBloom" title="踩奶与猫爪开花 (P)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="15.5" r="3.6"></circle>
          <circle cx="6.5" cy="10.5" r="1.8"></circle>
          <circle cx="10" cy="7.5" r="1.8"></circle>
          <circle cx="14" cy="7.5" r="1.8"></circle>
          <circle cx="17.5" cy="10.5" r="1.8"></circle>
        </svg>
        <span>猫爪开花</span>
      </button>

      <button type="button" class="action-pill" id="btnFeed" title="喂猫粮 (F)" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M5 10h14l2 8H3l2-8Z"></path>
          <path d="M8.5 6.5h.01m3.49-2h.01m3.49 2h.01"></path>
        </svg>
        <span id="labelFeed" aria-live="polite">喂猫粮</span>
      </button>
    </div>

    <!-- Utility Controls: Sliders, Shimmy Shake, Haptics -->
    <div class="toolbar">
      <button type="button" class="tool-btn" id="btnSettings" title="缅因猫体型与物理细节调节" aria-label="缅因猫体型与物理细节调节">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <line x1="4" y1="8" x2="7" y2="8"></line>
          <line x1="12" y1="8" x2="20" y2="8"></line>
          <circle cx="9.5" cy="8" r="2.3"></circle>
          <line x1="4" y1="16" x2="12" y2="16"></line>
          <line x1="17" y1="16" x2="20" y2="16"></line>
          <circle cx="14.5" cy="16" r="2.3"></circle>
        </svg>
      </button>

      <button type="button" class="tool-btn" id="btnShake" title="抖毛蓬松理顺 (S)" aria-label="抖毛蓬松理顺">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3v3m0 12v3M4.9 4.9l2.1 2.1m10 10l2.1 2.1M3 12h3m12 0h3M4.9 19.1l2.1-2.1m10-10l2.1-2.1"></path>
          <circle cx="12" cy="12" r="3.2"></circle>
        </svg>
      </button>

      <button type="button" class="tool-btn" id="btnVibrate" title="震动反馈开关" aria-label="震动反馈开关">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
          <g transform="rotate(38 12 12)">
            <rect x="7.5" y="4.5" width="9" height="15" rx="2"></rect>
            <polyline points="4.3 8.5 3.1 10.2 4.5 12 3.1 13.8 4.3 15.5"></polyline>
            <polyline points="19.7 8.5 20.9 10.2 19.5 12 20.9 13.8 19.7 15.5"></polyline>
          </g>
        </svg>
      </button>
    </div>

    <!-- Expandable Customization Drawer -->
    <div class="settings-drawer" id="settingsDrawer">
      <div class="settings-card">
        <div class="slider-row">
          <span class="slider-label">圆润度</span>
          <input type="range" id="sliderChonk" min="80" max="132" value="100" />
          <span class="slider-val" id="valChonk">100%</span>
        </div>
        <div class="slider-row">
          <span class="slider-label">体型大小</span>
          <input type="range" id="sliderSize" min="80" max="122" value="100" />
          <span class="slider-val" id="valSize">100%</span>
        </div>
        <div class="slider-row">
          <span class="slider-label">蓬松毛长</span>
          <input type="range" id="sliderFur" min="75" max="145" value="100" />
          <span class="slider-val" id="valFur">100%</span>
        </div>
        <div class="slider-row">
          <span class="slider-label">软弹物理</span>
          <input type="range" id="sliderSoft" min="60" max="155" value="100" />
          <span class="slider-val" id="valSoft">100%</span>
        </div>
        <div class="settings-actions">
          <button type="button" class="mini-btn active" id="btnToggleHand">手部显示：开</button>
          <button type="button" class="mini-btn" id="btnBrushReset">抖毛理顺</button>
          <button type="button" class="mini-btn" id="btnResetAll">重置默认</button>
        </div>
      </div>
    </div>

    <div class="footer-credit"><span>Maine Coon · 缅因猫</span></div>
  </main>

  <script defer src="js/assets_bundle.js"></script>
  <script defer src="js/scene_assets.js"></script>
  <script defer src="js/layout.js"></script>
  <script defer src="js/physics.js"></script>
  <script defer src="js/audio.js"></script>
  <script defer src="js/renderer.js"></script>
  <script defer src="js/feed-bowl.js"></script>
  <script defer src="js/app.js"></script>
</body>
</html>
