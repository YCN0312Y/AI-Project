function feather(g, len, wid, pal) {
  const gr = g.createLinearGradient(0, 0, len, 0); gr.addColorStop(0, pal.c1); gr.addColorStop(.45, pal.c2); gr.addColorStop(1, pal.c3);
  g.fillStyle = gr; g.beginPath(); g.moveTo(0, 0); g.quadraticCurveTo(len * .5, -wid, len, 0); g.quadraticCurveTo(len * .5, wid * .45, 0, 0); g.fill();
}

// 晶莹风之光翼（仅在起飞/飞翔/张开翅膀镜头中于少女背后展开）
function drawLightWings(g, x, y, s, open, flap, alpha, pal = PAL.cyan) {
  if (open <= .02 || alpha <= .01) return;
  g.save(); g.translate(x, y); g.scale(s, s); g.globalCompositeOperation = "lighter";
  const fl = Math.sin(flap);
  for (const side of [-1, 1]) {
    g.save(); g.scale(side, 1); g.translate(16, -4); g.rotate(fl * .25 * (1 - open * .25));
    for (let row = 1; row >= 0; row--) {
      const N = 9;
      for (let i = 0; i < N; i++) {
        const u = i / (N - 1);
        const ang = lerp(lerp(.9, 1.4, u), lerp(-.92, .5, u) + row * .12, open);
        const len = (row ? .6 : 1) * (105 + 150 * Math.sin(Math.PI * (.15 + .75 * u))) * (.4 + .6 * open);
        g.save(); g.rotate(ang); g.globalAlpha = alpha * (row ? .3 : .46) * open;
        feather(g, len, row ? 13 : 19, pal); g.restore();
      }
    }
    g.restore();
  }
  g.restore();
}

// 辅助：精致蝴蝶结（修复金色描边被藏青描边覆盖的问题）
function wgBow(g, x, y, s, fill, shade, rot = 0, goldTrim = false) {
  g.save(); g.translate(x, y); g.rotate(rot); g.scale(s, s);
  g.lineJoin = "round"; g.lineCap = "round";
  g.fillStyle = shade; g.strokeStyle = WG.line; g.lineWidth = 2.0;
  for (const side of [-1, 1]) {
    g.beginPath(); g.moveTo(side * 2.5, 2); g.quadraticCurveTo(side * 10, 15, side * 12, 22);
    g.lineTo(side * 5, 19); g.lineTo(side * 2, 22); g.closePath(); g.fill(); g.stroke();
    if (goldTrim) { g.strokeStyle = WG.goldLt; g.lineWidth = 1.2; g.stroke(); g.strokeStyle = WG.line; g.lineWidth = 2.0; }
  }
  for (const side of [-1, 1]) {
    g.fillStyle = fill;
    g.beginPath(); g.moveTo(0, 0);
    g.bezierCurveTo(side * 11, -12, side * 22, -8, side * 20, 2);
    g.bezierCurveTo(side * 20, 11, side * 9, 11, 0, 3); g.closePath(); g.fill();
    g.strokeStyle = WG.line; g.lineWidth = 2.1; g.stroke();
    if (goldTrim) { g.strokeStyle = WG.goldLt; g.lineWidth = 1.3; g.stroke(); }
    g.fillStyle = shade; g.beginPath(); g.moveTo(side * 3, .8); g.lineTo(side * 12, -2.5); g.lineTo(side * 11, 3.8); g.closePath(); g.fill();
  }
  g.fillStyle = goldTrim ? WG.gold : fill; g.strokeStyle = WG.line; g.lineWidth = 2.0;
  g.beginPath(); g.ellipse(0, 1, 4.5, 4.5, 0, 0, TAU); g.fill(); g.stroke();
  g.restore();
}

function wgScallops(g, pts, r, lw = 2.1) {
  g.fillStyle = WG.cream; g.strokeStyle = WG.line; g.lineWidth = lw;

  g.quadraticCurveTo(15, y(-6.6, 4), 12.6, y(-5.4, 5));
  g.quadraticCurveTo(12.7, y(-1, 5.5), 10.9, y(2, 5.9));
  g.bezierCurveTo(11.6, y(-6.2, 6.4), 6.7, y(-9.8, 8.5), 1, y(-9.7, 8.5));
  g.bezierCurveTo(-4.7, y(-9.8, 8.5), -9.9, y(-6.4, 6.2), -12.5, y(1.2, 2.6));

}

function wgEye(g, cx, cy, side, expr, blink, lookX, lookY, pulse) {
  g.save(); g.translate(cx, cy); g.scale(side, 1);
  const wink = expr === "wink" && side === 1;
  const open = expr === "determined" ? .77 : expr === "awe" ? 1.08 : 1;
  g.fillStyle = WG.lash;
  if (wink) {
    g.fill(wgSmileLash);
    g.restore(); return;
  }
  g.translate(0, (1 - open) * 2);
  g.scale(1, open);
  if (blink >= .999) { wgBlinkLash(g, 1); g.restore(); return; }
  const lower = expr === "happy" ? 8 : 10.8;
  g.save();
  g.beginPath(); g.moveTo(-12.4, 1.2);
  g.bezierCurveTo(-10.8, -8, -2, -13.4, 6.7, -10.6);
  g.bezierCurveTo(13, -9.1, 13.4, -2, 11.1, 3.5);
  g.bezierCurveTo(8.8, lower + 3, -8.4, lower + 3, -12.4, 1.2);

    const y = (raised, lowered) => lerp(raised, lowered, blink);

    g.bezierCurveTo(-9.9, y(-6.4, 6.2), -4.7, y(-9.8, 8.5), 1, y(-9.7, 8.5));
    g.bezierCurveTo(6.7, y(-9.8, 8.5), 11.6, y(-6.2, 6.4), 10.9, y(2, 5.9));
    g.lineTo(13.1, y(.2, 4.3));
    g.bezierCurveTo(10, y(18, 8.9), -6.4, y(18, 10), -12.5, y(1.2, 2.6));
    g.closePath(); g.clip();
  }
  const white = g.createLinearGradient(0, -11, 0, 4);
  white.addColorStop(0, "#c7c4de"); white.addColorStop(.6, "#f5f2f8"); white.addColorStop(1, "#fffdfb");
  g.fillStyle = white; g.fillRect(-14, -14, 28, 30);
  const ix = -.7 + side * lookX * 2, iy = lookY * 1.4;
  g.translate(ix, iy);
  const iris = g.createLinearGradient(0, -10.6, 0, 11.2);
  iris.addColorStop(0, "#253461"); iris.addColorStop(.32, "#3d5699");
  iris.addColorStop(.65, "#628ed1"); iris.addColorStop(.84, "#8ccce9"); iris.addColorStop(1, "#cbf2f5");
  g.fillStyle = iris; g.beginPath(); g.ellipse(0, .3, 9.1, 11.6, -.035, 0, TAU); g.fill();
  g.strokeStyle = "rgba(45,60,109,.54)"; g.lineWidth = .7; g.stroke();
  g.clip();
  g.fillStyle = "rgba(129,169,225,.53)";
  g.beginPath(); g.moveTo(-8, .1); g.quadraticCurveTo(-5.2, .7, -4.8, 3.1);
  g.lineTo(-6.6, 5.4); g.quadraticCurveTo(-8.4, 3.3, -8, .1); g.fill();
  g.fillStyle = "#2f406f"; g.beginPath(); g.ellipse(0, -1, 2.15, 3.8, 0, 0, TAU); g.fill();
  g.fillStyle = "rgba(193,241,253,.67)";
  g.beginPath(); g.moveTo(-7.6, 8.5); g.bezierCurveTo(-3.8, 4, 3.7, 3.7, 7.4, 7.7);
  g.bezierCurveTo(4.6, 12.1, -3.5, 13.1, -7.6, 8.5); g.fill();
  g.fillStyle = "#fff"; g.beginPath(); g.moveTo(-side * 3.6, -9.3);
  g.quadraticCurveTo(-side * 3.2, -8, -side * 1.5, -7);
  g.quadraticCurveTo(-side * 1.6, -5.2, -side * 3.6, -3.8);
  g.quadraticCurveTo(-side * 5.6, -5, -side * 5.7, -6.5);
  g.quadraticCurveTo(-side * 5, -8.5, -side * 3.6, -9.3); g.fill();
  g.fillStyle = `rgba(222,246,255,${.72 + .2 * pulse})`;
  g.beginPath(); g.arc(side * 5.4, -2.8, 1.1, 0, TAU); g.fill();

  g.fillStyle = "#704457";
  g.beginPath(); g.moveTo(9.4, -9.5); g.quadraticCurveTo(13.2, -8.8, 15.9, -10.2);
  g.quadraticCurveTo(14.7, -7.9, 12.1, -6.9); g.fill();
  g.strokeStyle = "rgba(170,105,116,.53)"; g.lineWidth = .65; g.lineCap = "round";
  g.beginPath(); g.moveTo(10.8, 4); g.quadraticCurveTo(10, 6.8, 8, 8); g.stroke();
  g.strokeStyle = "rgba(161,104,117,.42)";
  g.beginPath(); g.moveTo(-7.8, -10.3); g.quadraticCurveTo(-2.3, -15.4, 4.8, -13.9); g.stroke();
  g.restore();
}

function wgMouth(g, cx, cy, expr, mouthOpen) {
  g.save(); g.translate(cx, cy);
  const sing = clamp(mouthOpen), happy = expr === "happy";
  const opening = Math.max(sing, happy ? .3 : expr === "awe" ? .2 : 0);
  const w = (happy ? 3.9 : 1.8) + opening * 1.7, h = opening * 7.2;
  g.lineCap = "round";
  if (opening > .06) {
    g.beginPath(); g.moveTo(-w, 0); g.quadraticCurveTo(0, happy ? 1.1 : -h * .56, w, 0);
    g.bezierCurveTo(w * .82, h, -w * .62, h * 1.12, -w, 0);
    g.fillStyle = "#b96077"; g.fill(); g.save(); g.clip();
    g.fillStyle = "#ffb2b0"; g.beginPath(); g.ellipse(.2, h * .85, w * .92, h * .51, -.14, 0, TAU); g.fill();

    g.bezierCurveTo(-92 + sw, 52, -86 + sw * .8, 44, -74 + sw * .7, 35);
    g.bezierCurveTo(-84 + sw * .5, 16, -75 + sw * .3, -12, -64, -38);
    g.bezierCurveTo(-66, -78, -45, -108, 0, -108);

    g.bezierCurveTo(16 + sw * .2, 45, 8, 52, 0, 48);

    g.bezierCurveTo(-44 + sw * .5, 58, -52 + sw * .6, 48, -62 + sw * .8, 56);
    g.bezierCurveTo(-76 + sw, 62, -84 + sw * .9, 52, -74 + sw * .8, 42);
    g.bezierCurveTo(-84 + sw * .6, 22, -75 + sw * .3, -6, -65, -36);
    g.bezierCurveTo(-66, -80, -44, -110, 0, -110);

// =====================================================================
// 主绘制函数 drawWhaleGirl(g, x, y, s, opts)
// =====================================================================
function drawWhaleGirl(g, x, y, s = 1, o = {}) {
  const alpha = o.alpha ?? 1; if (alpha <= .01) return;
  const t = o.t ?? 0;
  const view = o.view || "front";          // "front" | "back"
  const expr = o.expr || "calm";           // "calm" | "happy" | "determined" | "awe" | "wink"
  const pose = o.pose || "stand";          // "stand" | "walk" | "run" | "sway" | "jump" | "cheer" | "sing" | "heart" | "open_arms" | "fly" | "spread_wings"
  const pulse = o.pulse ?? 0;
  const beat = o.beat ?? 0;
  const wind = o.wind ?? .25;
  const wingsAmt = o.wingsAmt ?? 0;
  const mouthOpen = o.mouthOpen ?? 0;
  const blink = o.blink ?? wgBlink(t);
  const aura = o.aura || GL.cyan;
  const auraAlpha = o.auraAlpha ?? .42;
  const reflect = o.reflect ?? false;

  const wag = Math.sin(t * 4.5) * (.16 + .08 * pulse) - wind * .15;
  const earFlap = Math.sin(t * 5.2) * .05 + pulse * .04;
  const sway = pose === "sway" ? Math.sin(beat * Math.PI) * .1 : 0;

  g.save();
  g.translate(x, y);
  if (o.tilt) g.rotate(o.tilt);
  g.scale(s, s);
  g.globalAlpha = alpha;

  if (!reflect && auraAlpha > .01) {
    g.globalCompositeOperation = "lighter";
    glow(g, aura, 0, -14, 320, auraAlpha * alpha);
    glow(g, GL.white, 0, -30, 140, auraAlpha * .36 * alpha);
  }
  g.globalCompositeOperation = "source-over";
  g.globalAlpha = alpha;

  if (wingsAmt > .01) {
    drawLightWings(g, 0, 8, 1.05, wingsAmt, t * 5.5, alpha * (.85 + .15 * pulse), o.wingPal || PAL.cyan);
    g.globalCompositeOperation = "source-over";
    g.globalAlpha = alpha;
  }

  // -------------------- 背面视图 --------------------
  if (view === "back") {
    wgAhoge(g, wind);
    wgHeadband(g);
    wgFinEar(g, -1, earFlap, true);
    wgFinEar(g, 1, earFlap, true);
    wgLegs(g, 0, 0);
    const lace = []; for (let i = -5; i <= 5; i++) lace.push([i * 9.8, 69 - Math.abs(i) * .55]);
    wgScallops(g, lace, 7.6, 2.0);
    const sg = g.createLinearGradient(0, 14, 0, 68); sg.addColorStop(0, WG.navy); sg.addColorStop(1, WG.navyDk);
    g.fillStyle = sg; g.strokeStyle = WG.line; g.lineWidth = 2.1; g.lineJoin = "round";
    g.beginPath(); g.moveTo(-20, 15); g.bezierCurveTo(-36, 30, -53, 49, -57, 64);
    g.quadraticCurveTo(0, 74, 57, 64); g.bezierCurveTo(53, 49, 36, 30, 20, 15); g.closePath(); g.fill(); g.stroke();
    g.strokeStyle = WG.gold; g.lineWidth = 1.9; g.beginPath();
    for (let i = 0; i <= 10; i++) { const u = i / 10, px = lerp(-51, 51, u), py = 59 + Math.sin(u * Math.PI * 6) * 2 + (1 - Math.abs(u - .5) * 2) * 3.5;
      i ? g.lineTo(px, py) : g.moveTo(px, py); } g.stroke();
    wgWavyBackHair(g, t, wind, true, 2.1);
    wgBow(g, -56, -49, .68, WG.skyBow, WG.skyBowDk, -.2);
    wgBow(g, 56, -49, .68, WG.skyBow, WG.skyBowDk, .2);
    wgWhaleTail(g, 4, 48, 62, wag - .12, 1);
    wgBow(g, 0, 27, 1.05, WG.cream, WG.creamSh, 0, false);
    g.restore(); return;
  }

  // -------------------- 正面 / 3/4动态视图 --------------------
  wgWavyBackHair(g, t, wind, false, 2.1);
  wgWhaleTail(g, 18, 42, 74, wag, 1);
  wgAhoge(g, wind);
  wgHeadband(g);
  wgFinEar(g, -1, earFlap, false);
  wgFinEar(g, 1, earFlap, false);

  const idleArm = .64 + .045 * Math.sin(t * 2.2);
  let lLegY = 0, rLegY = 0, lArm = idleArm, rArm = -idleArm, lProp = null;
  if (pose === "walk" || pose === "run") {
    lLegY = Math.sin(t * 9) * 5; rLegY = -lLegY;
    lArm = .42 + Math.sin(t * 9) * .38; rArm = -.42 + Math.sin(t * 9) * .38;
  } else if (pose === "sway") {
    lArm = .58 + Math.sin(beat * Math.PI) * .38; rArm = -.58 + Math.sin(beat * Math.PI) * .38;
  } else if (pose === "jump" || pose === "cheer") {
    lLegY = -4; rLegY = -4;
    lArm = 1.68 + Math.sin(t * 8) * .16; rArm = -1.68 - Math.sin(t * 8) * .16;
  } else if (pose === "sing") {
    lArm = .45 + Math.sin(t * 6) * .12; rArm = -1.6 + Math.sin(beat * Math.PI) * .25; lProp = "mic";
  } else if (pose === "open_arms" || pose === "spread_wings") {
    lArm = 1.38 + Math.sin(t * 4) * .08; rArm = -1.38 - Math.sin(t * 4) * .08;
  } else if (pose === "fly") {
    lLegY = 2 + Math.sin(t * 5) * 2.5; rLegY = 2 - Math.sin(t * 5) * 2.5;
    lArm = 1.12 + Math.sin(t * 5) * .12; rArm = -1.12 - Math.sin(t * 5) * .12;
  }
  wgLegs(g, lLegY, rLegY);
  wgDressFront(g, sway, 2.1);
  wgSideCurls(g, wind, sway * .5, 2.1);
  if (pose === "heart") {
    wgHeartArms(g, t);
  } else {
    wgArm(g, -1, lArm, lProp);
    wgArm(g, 1, rArm);
  }

  g.save(); g.rotate(sway * .5);
  wgFrontHead(g, expr, blink, mouthOpen, wind, o.lookX || 0, o.lookY || 0, pulse, 2.1);
  wgBow(g, -56, -49, .68, WG.skyBow, WG.skyBowDk, -.2);
  wgBow(g, 56, -49, .68, WG.skyBow, WG.skyBowDk, .2);
  g.restore();

  g.restore();
}

const WG_BLINK_STARTS = [1.04, 4.32, 6.86, 9.97, 12.05];
function wgBlink(t) {
  const phase = t % 13.26;
  for (const start of WG_BLINK_STARTS) {
    const dt = phase - start;
    if (dt >= 0 && dt < .31) return smooth(0, .09, dt) * (1 - smooth(.145, .31, dt));
  }
  return 0;
}

  if (S.t < a || S.t > b) return 0;
  return clamp(.15 + .45 * Math.abs(Math.sin(S.t * 11)) * (.4 + .6 * S.rms));
};

let scale = 1;
const vignette = (() => { const c = document.createElement("canvas"); c.width = 960; c.height = 540; const x = c.getContext("2d");
  const gr = x.createRadialGradient(480, 270, 180, 480, 270, 620); gr.addColorStop(0, "rgba(0,0,0,0)"); gr.addColorStop(1, "rgba(0,0,0,.55)");
  x.fillStyle = gr; x.fillRect(0, 0, 960, 540); return c; })();
function resize() {
  const ww = innerWidth, wh = innerHeight; let w = ww, h = ww * 9 / 16; if (h > wh) { h = wh; w = wh * 16 / 9; }
  cv.style.width = w + "px"; cv.style.height = h + "px";
  const px = Math.min(1920, Math.round(w * Math.min(devicePixelRatio || 1, 2)));
  cv.width = layer.width = px; cv.height = layer.height = Math.round(px * 9 / 16); scale = px / VW;
}
addEventListener("resize", resize); resize();

const findIdx = (arr, t) => { for (let i = arr.length - 1; i >= 0; i--) if (t >= arr[i].s) return i; return 0; };
function beatInfo(t) { const bp = (t - PHASE) / BEAT, bi = Math.floor(bp), bf = bp - bi; return { bp, bi, bf, pulse: Math.exp(-bf * 5), barBeat: ((bi % 4) + 4) % 4 }; }
function singSpan(L) { const [a, b] = L.sing || [0.04, 0.86]; const d = L.e - L.s; return [L.s + d * a, L.s + d * b]; }
function stateFor(blk, t) {
  const li = findIdx(LYRICS, t), line = t < LYRICS[LYRICS.length - 1].e ? LYRICS[li] : null;
  let kara = 0; if (line) { const [a, b] = singSpan(line); kara = clamp((t - a) / (b - a)); }
  return { t, lt: t - blk.s, dur: blk.e - blk.s, p: clamp((t - blk.s) / (blk.e - blk.s)), B: beatInfo(t), rms: envAt(RMS, t), low: envAt(LOW, t), line, kara };
}
function drawScene(g, blk, t, shake) {
  g.save(); g.setTransform(scale, 0, 0, scale, 0, 0);
  if (shake) { g.translate(VW / 2 + shake.x, VH / 2 + shake.y); g.scale(1.03, 1.03); g.translate(-VW / 2, -VH / 2); }
  g.globalAlpha = 1; g.globalCompositeOperation = "source-over";
  try { SC[blk.scene](g, stateFor(blk, t)); } catch (e) { console.error(blk.scene, e); }
  g.restore(); g.globalAlpha = 1; g.globalCompositeOperation = "source-over";
}
function composite(type, k) {
  const W = cv.width, H = cv.height; ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0);
  if (type === "iris" || type === "wipe") {
    ctx.beginPath();
    if (type === "iris") ctx.arc(W / 2, H / 2, easeOut(k) * Math.hypot(W, H) * .55, 0, TAU);
    else { const x = lerp(-W * .35, W * 1.35, ease(k)); ctx.moveTo(0, 0); ctx.lineTo(x + W * .2, 0); ctx.lineTo(x - W * .2, H); ctx.lineTo(0, H); ctx.closePath(); }
    ctx.save(); ctx.clip(); ctx.drawImage(layer, 0, 0); ctx.restore();
    ctx.globalCompositeOperation = "lighter"; ctx.strokeStyle = `rgba(255,240,200,${.8 * (1 - k)})`; ctx.lineWidth = 6 * scale; ctx.stroke();
  } else if (type === "zoom") {
    const s = lerp(1.25, 1, easeOut(k)); ctx.globalAlpha = ease(k); ctx.translate(W / 2, H / 2); ctx.scale(s, s); ctx.drawImage(layer, -W / 2, -H / 2);
  } else { ctx.globalAlpha = type === "flash" ? easeOut(k * 1.6) : ease(k); ctx.drawImage(layer, 0, 0);
    if (type === "flash") { ctx.globalAlpha = 1; ctx.globalCompositeOperation = "lighter"; ctx.fillStyle = `rgba(255,255,255,${Math.pow(1 - k, 2) * .85})`; ctx.fillRect(0, 0, W, H); } }
  ctx.restore();
}

// ---- 歌词（卡拉OK 逐字点亮） ----
const layoutCache = new Map();
function lyricLayout(i, size) {
  const key = i + "_" + size; if (layoutCache.has(key)) return layoutCache.get(key);
  const L = LYRICS[i]; ctx.save(); ctx.font = `800 ${size}px "Microsoft YaHei", "PingFang SC", sans-serif`;
  const chars = [...L.text], gap = /[A-Za-z]/.test(L.text) ? 2 : 8; let x = 0; const out = [];
  const singN = chars.filter(c => c !== " ").length, [a, b] = singSpan(L); let si = 0;
  for (const ch of chars) { const w = ctx.measureText(ch).width; const o = { ch, x, w };
    if (ch !== " ") { o.ts = a + (b - a) * si / singN; o.te = a + (b - a) * (si + 1) / singN; si++; } out.push(o); x += w + gap; }
  ctx.restore(); const res = { chars: out, width: x - gap }; layoutCache.set(key, res); return res;
}
function drawLyrics(g, t) {
  const li = findIdx(LYRICS, t), L = LYRICS[li]; if (!L || t >= L.e + .3 || t < L.s) return;
  const size = 66, y = 952, lay = lyricLayout(li, size), [c1, c2] = WHO_COLOR[L.who];
  const vanish = clamp((L.e + .25 - t) / .3), x0 = VW / 2 - lay.width / 2 + 44;
  g.save(); g.setTransform(scale, 0, 0, scale, 0, 0); g.textBaseline = "middle"; g.textAlign = "left";
  const ba = easeOut((t - L.s) / .3) * vanish; g.globalAlpha = ba;
  rr(g, x0 - 104, y - 26, 72, 52, 26); g.fillStyle = "rgba(8,10,28,.6)"; g.fill(); g.lineWidth = 3; g.strokeStyle = c2; g.stroke();
  g.font = `800 30px "Microsoft YaHei", sans-serif`; g.fillStyle = c1; g.textAlign = "center"; g.fillText(L.who, x0 - 68, y + 1); g.textAlign = "left";
  g.font = `800 ${size}px "Microsoft YaHei", "PingFang SC", sans-serif`; g.lineJoin = "round";
  const hg = g.createLinearGradient(0, y - 36, 0, y + 36); hg.addColorStop(0, c1); hg.addColorStop(1, c2);
  lay.chars.forEach((c, i) => { if (c.ch === " ") return; const a = easeOut((t - L.s - i * .03) / .3), oy = (1 - a) * 34; g.globalAlpha = a * vanish;
    const x = x0 + c.x, yy = y + oy; g.strokeStyle = "rgba(6,8,24,.7)"; g.lineWidth = 9; g.strokeText(c.ch, x, yy);
    g.fillStyle = "rgba(255,255,255,.93)"; g.fillText(c.ch, x, yy);
    const pr = clamp((t - c.ts) / (c.te - c.ts)); if (pr > 0) { g.save(); g.beginPath(); g.rect(x - 2, yy - size, (c.w + 4) * pr, size * 2); g.clip();
      g.shadowColor = c2; g.shadowBlur = 22; g.fillStyle = hg; g.fillText(c.ch, x, yy); g.restore(); } });
  const N = LYRICS[li + 1]; if (N && N.s - t < 1.6 && N.s > t) { g.globalAlpha = .7 * clamp((1.6 - (N.s - t)) / .4); g.font = `600 30px "Microsoft YaHei", sans-serif`;
    g.textAlign = "center"; g.fillStyle = "#e8f0ff"; g.strokeStyle = "rgba(6,8,24,.85)"; g.lineWidth = 6; const s2 = `${N.who}：${N.text}`; g.strokeText(s2, VW / 2, 1030); g.fillText(s2, VW / 2, 1030); }
  g.restore();
}
function sectionName(t) { return t < 13.75 ? "VERSE Ⅰ · 男声" : t < 27.45 ? "VERSE Ⅱ · 女声" : t < 40.35 ? "HOOK · 对唱" : t < 54.10 ? "CHORUS Ⅰ · 合唱" : t < 68.3 ? "CHORUS Ⅱ · 合唱" : "THE END"; }
function drawHUD(g, t) {
  g.save(); g.setTransform(scale, 0, 0, scale, 0, 0); g.globalAlpha = .85; g.textBaseline = "middle";
  g.font = `800 28px "Microsoft YaHei", sans-serif`; g.fillStyle = "#fff"; g.shadowColor = "rgba(0,0,0,.6)"; g.shadowBlur = 8; g.fillText("我乘着风飞过来", 56, 62);
  g.font = `600 18px Consolas, "Microsoft YaHei", monospace`; g.fillStyle = "#ffd36b"; g.fillText(sectionName(t), 58, 98); g.shadowBlur = 0;
  const B = beatInfo(t); for (let i = 0; i < 4; i++) { const on = i === B.barBeat; g.globalAlpha = on ? .5 + .5 * B.pulse : .3;
    g.fillStyle = on ? "#ffd36b" : "#fff"; g.beginPath(); g.arc(VW - 150 + i * 30, 66, on ? 8 + 4 * B.pulse : 6, 0, TAU); g.fill(); }
  g.restore();
}
function render(t, preview) {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = "source-over"; ctx.fillStyle = "#000"; ctx.fillRect(0, 0, cv.width, cv.height);
  if (preview) { drawScene(ctx, { s: 40.35, e: 43.8, scene: "fly" }, t); ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.drawImage(vignette, 0, 0, cv.width, cv.height); ctx.restore(); return; }
  const bi = findIdx(BLOCKS, t), blk = BLOCKS[bi], B = beatInfo(t);
  let shake = null; if (t > 40.35 && t < 68.3) { const amp = 9 * envAt(LOW, t) * B.pulse; shake = { x: Math.sin(t * 91) * amp, y: Math.cos(t * 77) * amp }; }
  const tr = TRANS[blk.scene], td = tr ? tr[1] : 0;
  if (bi > 0 && tr && t - blk.s < td) { drawScene(ctx, BLOCKS[bi - 1], t, shake); lctx.setTransform(1, 0, 0, 1, 0, 0); lctx.clearRect(0, 0, layer.width, layer.height);
    drawScene(lctx, blk, t, shake); composite(tr[0], (t - blk.s) / td); }
  else drawScene(ctx, blk, t, shake);
  ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.drawImage(vignette, 0, 0, cv.width, cv.height); ctx.restore();
  if (showLyrics) drawLyrics(ctx, t);
  if (t < 68.3) drawHUD(ctx, t);
}

// ============ 7. 播放控制 ============
const audio = document.getElementById("audio"), overlay = document.getElementById("overlay"), ctrl = document.getElementById("ctrl");
const btnPlay = document.getElementById("btnPlay"), btnLyric = document.getElementById("btnLyric"), btnFull = document.getElementById("btnFull");
const bar = document.getElementById("bar"), fill = bar.querySelector(".fill"), timeEl = document.getElementById("time"), errEl = document.getElementById("err");
let showLyrics = true, started = false, audioOK = true, simPlaying = false, simT = 0, simStart = 0, lastAT = -1, lastPT = 0;
const params = new URLSearchParams(location.search); const frozenT = params.has("t") ? parseFloat(params.get("t")) : null;

[13.75, 27.45, 40.35, 54.10].forEach(s => { const m = document.createElement("div"); m.className = "mark"; m.style.left = (s / DURATION * 100) + "%"; bar.appendChild(m); });
audio.addEventListener("error", () => { audioOK = false; errEl.style.display = "block"; });
document.getElementById("filePick").addEventListener("change", e => { const f = e.target.files[0]; if (!f) return;
  audio.src = URL.createObjectURL(f); audioOK = true; errEl.style.display = "none"; audio.load(); });

const isPlaying = () => audioOK ? !audio.paused : simPlaying;
function curTime() {
  if (frozenT !== null) return frozenT;
  if (audioOK) { const at = audio.currentTime; if (audio.paused) return at; const now = performance.now();
    if (at !== lastAT) { lastAT = at; lastPT = now; return at; } return at + Math.min(.1, (now - lastPT) / 1000); }
  if (simPlaying) { const v = simT + (performance.now() - simStart) / 1000; if (v >= DURATION) { simPlaying = false; simT = DURATION; updateBtn(); } return Math.min(v, DURATION); }
  return simT;
}
function play() {
  if (!started) { started = true; overlay.classList.add("gone"); }
  if (audioOK) { if (audio.ended || audio.currentTime >= DURATION - .05) audio.currentTime = 0;
    audio.play().catch(() => { audioOK = false; simT = audio.currentTime || 0; play(); }); }
  else { if (simT >= DURATION) simT = 0; simStart = performance.now(); simPlaying = true; }
  updateBtn(); poke();
}
function pause() { if (audioOK) audio.pause(); else if (simPlaying) { simT = curTime(); simPlaying = false; } updateBtn(); poke(); }
function toggle() { isPlaying() ? pause() : play(); }
function seek(t) { t = clamp(t, 0, DURATION - .01); if (audioOK) audio.currentTime = t; else { simT = t; simStart = performance.now(); } lastAT = -1; poke(); }
function updateBtn() { btnPlay.textContent = isPlaying() ? "❚❚ 暂停" : "▶ 播放"; }
audio.addEventListener("play", updateBtn); audio.addEventListener("pause", updateBtn);
audio.addEventListener("ended", () => { updateBtn(); ctrl.classList.remove("hidden"); });

document.getElementById("playBig").addEventListener("click", play);
btnPlay.addEventListener("click", toggle);
btnLyric.addEventListener("click", () => { showLyrics = !showLyrics; btnLyric.classList.toggle("on", showLyrics); });
function toggleFull() { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen?.(); }
btnFull.addEventListener("click", toggleFull);
let dragging = false;
const seekFromEvent = e => { const r = bar.getBoundingClientRect(); seek(clamp((e.clientX - r.left) / r.width) * DURATION); };
bar.addEventListener("pointerdown", e => { dragging = true; bar.setPointerCapture(e.pointerId); seekFromEvent(e); });
bar.addEventListener("pointermove", e => { if (dragging) seekFromEvent(e); });
bar.addEventListener("pointerup", () => dragging = false);
document.getElementById("stage").addEventListener("click", () => { if (started) toggle(); });
addEventListener("keydown", e => {
  if (e.code === "Space") { e.preventDefault(); started ? toggle() : play(); }
  else if (e.code === "ArrowRight") seek(curTime() + 5);
  else if (e.code === "ArrowLeft") seek(curTime() - 5);
  else if (e.code === "KeyF") toggleFull();
  else if (e.code === "KeyL") btnLyric.click();
});
let hideTimer = 0;
function poke() { if (!started) return; ctrl.classList.remove("hidden"); document.getElementById("stage").classList.remove("hide-cursor");
  clearTimeout(hideTimer); hideTimer = setTimeout(() => { if (isPlaying() && !dragging) { ctrl.classList.add("hidden"); document.getElementById("stage").classList.add("hide-cursor"); } }, 2600); }
addEventListener("mousemove", poke);
const fmt = s => { s = Math.max(0, s); return String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(Math.floor(s % 60)).padStart(2, "0"); };

if (frozenT !== null) { started = true; overlay.classList.add("gone"); }
function loop() {
  const t = curTime();
  if (!started) render(40.6 + (performance.now() / 1000) % 3, true);
  else render(Math.min(t, DURATION));
  fill.style.width = (clamp(t / DURATION) * 100) + "%"; timeEl.textContent = `${fmt(t)} / ${fmt(DURATION)}`;
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
</script>
